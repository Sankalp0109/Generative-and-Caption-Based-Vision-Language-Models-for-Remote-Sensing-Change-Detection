<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Labeller</title>
<style>
  :root { --bg:#111; --panel:#1c1c1c; --fg:#eee; --muted:#999; --accent:#4a9eff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:var(--panel); }
  header input { background:#000; color:var(--fg); border:1px solid #444; padding:6px 8px; border-radius:4px; }
  .muted { color:var(--muted); }
  main { padding:12px 16px; max-width:1400px; margin:auto; }
  .imgs { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  figure { margin:0; text-align:center; }
  figure img { width:600px; max-width:calc(100vw - 32px); aspect-ratio:1; display:block; background:#000; }
  figcaption { margin-top:4px; color:var(--muted); }
  .controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:14px 0 8px; }
  button { font:inherit; padding:10px 18px; border-radius:6px; border:1px solid #444; background:#2a2a2a; color:var(--fg); cursor:pointer; }
  button:hover { border-color:#777; }
  button.sel[data-label=change] { background:var(--bad); border-color:var(--bad); }
  button.sel[data-label=no_change] { background:var(--ok); border-color:var(--ok); color:#000; }
  button.sel[data-label=seasonal] { background:var(--warn); border-color:var(--warn); color:#000; }
  #save { background:var(--accent); border-color:var(--accent); }
  textarea { display:block; width:min(900px, 100%); margin:6px auto; min-height:70px; background:#000; color:var(--fg); border:1px solid #444; border-radius:6px; padding:8px; font:inherit; }
  textarea[hidden] { display:none; }
  #status { text-align:center; min-height:1.4em; }
  .nav { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-top:12px; }
  .nav a { width:34px; padding:4px 0; text-align:center; border-radius:4px; background:#2a2a2a; color:var(--fg); text-decoration:none; font-size:13px; }
  .nav a.done { background:#264d33; }
  .nav a.cur { outline:2px solid var(--accent); }
  .help { text-align:center; font-size:13px; }
</style>
</head>
<body>
<header>
  <strong>Change Labeller</strong>
  <button id="blink" type="button">Blink (B)</button>
  <span id="progress" class="muted"></span>
</header>
<main>
  <div id="info" class="muted" style="text-align:center;margin-bottom:8px"></div>
  <div class="imgs" id="imgs">
    <figure><img id="imgB" alt="before"><figcaption id="capB">Before</figcaption></figure>
    <figure><img id="imgA" alt="after"><figcaption id="capA">After</figcaption></figure>
  </div>
  <div class="controls">
    <button data-label="change">Change (1)</button>
    <button data-label="no_change">No change (2)</button>
    <button data-label="seasonal">Seasonal change (3)</button>
  </div>
  <textarea id="caption" placeholder="Describe the change: what changed and where (e.g. new buildings on open ground in the north-east)." hidden></textarea>
  <div class="controls">
    <button id="prev" type="button">← Prev</button>
    <button id="save" type="button">Save &amp; next (Ctrl+Enter)</button>
    <button id="next" type="button">Next →</button>
  </div>
  <div id="status"></div>
  <p class="help muted">Change = lasting land-use change (buildings, roads, construction, mining, ponds, clearing). Seasonal = only crop/vegetation colour or water level differs. Keys: 1/2/3 choose, B blink, ←/→ move.</p>
  <div class="nav" id="nav"></div>
</main>
<script src="pairs.js"></script>
<script>
const $ = id => document.getElementById(id);
let pairs = [], labels = {}, i = 0, choice = null, blinking = null;

const API = location.port === "8000" ? "" : "http://localhost:8000";   // works when opened as a file too
const mine = p => labels[p.patch_id];

function setChoice(c) {
  choice = c;
  document.querySelectorAll("button[data-label]").forEach(b => b.classList.toggle("sel", b.dataset.label === c));
  $("caption").hidden = c !== "change";
  if (c === "change") $("caption").focus();
}

function stopBlink() {
  if (blinking) { clearInterval(blinking); blinking = null; }
  const p = pairs[i]; if (!p) return;
  $("imgA").src = p.after; $("capA").textContent = "After · " + p.after_date;
}

function render() {
  stopBlink();
  const p = pairs[i]; if (!p) return;
  $("imgB").src = p.before; $("imgA").src = p.after;
  $("capB").textContent = "Before · " + p.before_date;
  $("capA").textContent = "After · " + p.after_date;
  $("info").textContent = `#${i + 1} of ${pairs.length} · ${p.state} · ${p.patch_id}`;
  const m = mine(p);
  $("caption").value = m && m.caption || "";
  setChoice(m ? m.label : null);
  $("status").textContent = m ? "Saved earlier — change and save again to update." : "";
  const done = pairs.filter(q => mine(q)).length;
  $("progress").textContent = `${done}/${pairs.length} done`;
  $("nav").innerHTML = pairs.map((q, k) =>
    `<a href="#" data-k="${k}" class="${mine(q) ? "done" : ""} ${k === i ? "cur" : ""}">${k + 1}</a>`).join("");
}

function go(k) { i = Math.max(0, Math.min(pairs.length - 1, k)); render(); }

async function save() {
  const p = pairs[i];
  if (!choice) { $("status").textContent = "Choose Change, No change or Seasonal."; return; }
  const caption = $("caption").value.trim();
  if (choice === "change" && !caption) { $("status").textContent = "Describe the change before saving."; $("caption").focus(); return; }
  $("status").textContent = "Saving…";
  try {
    const r = await fetch(API + "/save", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ patch_id: p.patch_id, label: choice, caption: choice === "change" ? caption : "" }) });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error);
    labels[p.patch_id] = { label: choice, caption };
    const next = pairs.findIndex((q, k) => k > i && !mine(q));
    go(next >= 0 ? next : i);
    $("status").textContent = "Saved ✓";
  } catch (e) {
    $("status").textContent = "Save failed: " + e.message + " (is server.py running?)";
  }
}

document.querySelectorAll("button[data-label]").forEach(b => b.onclick = () => setChoice(b.dataset.label));
$("save").onclick = save;
$("prev").onclick = () => go(i - 1);
$("next").onclick = () => go(i + 1);
$("nav").onclick = e => { if (e.target.dataset.k) { e.preventDefault(); go(+e.target.dataset.k); } };
$("blink").onclick = () => {
  if (blinking) return stopBlink();
  const p = pairs[i]; let showBefore = false;
  blinking = setInterval(() => {
    showBefore = !showBefore;
    $("imgA").src = showBefore ? p.before : p.after;
    $("capA").textContent = (showBefore ? "BEFORE · " + p.before_date : "AFTER · " + p.after_date) + " (blinking)";
  }, 600);
};
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); return save(); }
  if (["TEXTAREA", "INPUT"].includes(document.activeElement.tagName)) return;
  if (e.key === "1") setChoice("change");
  else if (e.key === "2") setChoice("no_change");
  else if (e.key === "3") setChoice("seasonal");
  else if (e.key === "b" || e.key === "B") $("blink").click();
  else if (e.key === "ArrowLeft") go(i - 1);
  else if (e.key === "ArrowRight") go(i + 1);
  else return;
  e.preventDefault();
});

pairs = PAIRS;
fetch(API + "/labels").then(r => r.json()).then(l => { labels = l; })
  .catch(() => { $("status").textContent = "Server not running: images show, but Save needs  python labeler/server.py"; })
  .finally(() => { const k = pairs.findIndex(q => !mine(q)); go(k >= 0 ? k : 0); });
</script>
</body>
</html>
